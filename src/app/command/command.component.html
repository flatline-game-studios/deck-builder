<div class="d-flex flex-row itg-command-container">
    <div class="itg-command">

        <div class="inner-command">
            <div class="d-flex flex-grow-1 justify-content-start align-items-center ">
                <div class="flex-grow-1 " style="padding-left: 20px;">
                    <div class="command-name">
                        <span>{{ command.CommandName }}</span>
                        <span class="command-tier" > {{ command.Tier | uppercase  }}</span>
                    </div>
                    <div class="command-description"><div [innerHTML]="sanitizedDescription" ></div></div>
                </div>
                <div class="flex-grow-1 d-flex flex-column align-items-end" style="padding-right: 20px;">
                    <div class="d-flex flex-column align-items-center">
                        <div class="command-cost">{{ command.Cost }}</div>
                        <div class="command-vim">VIM</div>
                    </div>
                </div>
            </div>
        </div>
    </div>
<!--    <div class="itg-command-r"></div>-->
<!--    <div class="itg-command-rr"></div>-->
</div>
