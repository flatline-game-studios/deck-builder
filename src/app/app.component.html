<div  class="itg-container">
    <div class="d-flex flex-grow-1 flex-row card-container flex-wrap" *ngIf="showCards.length">
        <!--       <div class="card-grid">-->
        <div *ngFor="let card of showCards" class="card-box">
            <app-card [card]="card"></app-card>
        </div>
        <!--       </div>-->
    </div>
    <div class="d-flex flex-column  justify-content-start"  *ngIf="showDrivers.length">
        <div *ngFor="let driver of showDrivers" class="driver-box">
            <app-driver [driver]="driver"></app-driver>
        </div>
    </div>
</div>
